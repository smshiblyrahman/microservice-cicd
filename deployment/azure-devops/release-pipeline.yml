trigger:
  branches:
    include:
      - main
pool:
  vmImage: 'ubuntu-latest'

variables:
  azureSubscription: 'ecommerce-service-connection'
  kubernetesCluster: 'ecommerce-aks'
  resourceGroup: 'ecommerce-rg'
  acrRegistry: 'myregistry.azurecr.io'

stages:
- stage: Deploy
  jobs:
  - job: BlueGreenDeployment
    steps:
    - task: HelmDeploy@0
      inputs:
        connectionType: 'Azure Resource Manager'
        azureSubscription: $(azureSubscription)
        azureResourceGroup: $(resourceGroup)
        kubernetesCluster: $(kubernetesCluster)
        command: 'upgrade'
        chartType: 'FilePath'
        chartPath: 'helm/ecommerce'
        releaseName: 'ecommerce-green'
        arguments: '--set global.tag=$(Build.BuildId)'
    - script: |
        echo "Running Smoke Tests on Green..."
        bash tests/smoke_test.sh
      displayName: 'Smoke Tests'
    # Wait for approval or automatically switch traffic in the real environment
