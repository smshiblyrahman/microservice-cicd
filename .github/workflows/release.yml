name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: myregistry.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Images
        run: |
          for svc in user-service product-service order-service payment-service; do
            docker build -t myregistry.azurecr.io/$svc:${{ github.sha }} ./services/$svc
            docker push myregistry.azurecr.io/$svc:${{ github.sha }}
          done
          docker build -t myregistry.azurecr.io/gateway:${{ github.sha }} ./gateway
          docker push myregistry.azurecr.io/gateway:${{ github.sha }}
